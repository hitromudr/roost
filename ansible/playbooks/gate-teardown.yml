---
# Removes roost from a gate.
#
#   ansible-playbook -i ansible/inventory ansible/playbooks/gate-teardown.yml \
#     -e gate_domain=cc.example --check
#
# The vhost and the tunnel account go. The client CA stays unless you pass
# -e roost_purge=true: deleting it invalidates every certificate you have
# installed on your devices, and reissuing them means touching each phone
# again.
- name: Remove roost from the gate
  hosts: gate
  become: true
  vars:
    roost_purge: false
    gate_tunnel_user: roost-tunnel
    gate_ca_dir: /etc/roost/ca
  tasks:
    - name: Require the domain whose vhost is being removed
      ansible.builtin.assert:
        that: gate_domain | default('') | length > 0
        fail_msg: pass -e gate_domain=<name> so the right vhost is removed
        quiet: true

    - name: Disable the vhost
      ansible.builtin.file:
        path: "/etc/nginx/sites-enabled/roost-{{ gate_domain }}.conf"
        state: absent
      notify: Reload nginx

    - name: Remove the vhost
      ansible.builtin.file:
        path: "/etc/nginx/sites-available/roost-{{ gate_domain }}.conf"
        state: absent
      notify: Reload nginx

    - name: Remove the tunnel account
      ansible.builtin.user:
        name: "{{ gate_tunnel_user }}"
        state: absent
        remove: true

    - name: Remove the client CA and the certificates it issued
      ansible.builtin.file:
        path: "{{ gate_ca_dir }}"
        state: absent
      when: roost_purge | bool

    - name: Say what was left alone
      ansible.builtin.debug:
        msg: >-
          Removed the vhost for {{ gate_domain }} and the tunnel account.
          {% if roost_purge | bool %}The client CA is gone too.
          {% else %}The client CA is still in {{ gate_ca_dir }} — certificates
          on your devices keep working; pass -e roost_purge=true to remove it.
          {% endif %}
          The TLS certificate for {{ gate_domain }} was not touched.

  handlers:
    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      failed_when: false
      when: not ansible_check_mode
