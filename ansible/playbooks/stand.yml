---
# The stand: the machine agents run on.
#
#   ansible-playbook -i ansible/inventory ansible/playbooks/stand.yml --check
#
# Start with --check. The egress policy decides what the agent can reach, and
# a surprise there is a surprise about your agent's network access.
#
# What this deliberately does not do is put a web terminal or a tunnel on the
# machine. Serving sessions to a phone is somebody else's job: the sessions
# are plain tmux, anything that speaks tmux works with them, and a machine
# that already has a terminal of its own does not need a second owner for it.
- name: Configure the agent stand
  hosts: stand
  become: true
  roles:
    - role: egress_sandbox
      tags: [egress]
    - role: agent_sessions
      tags: [sessions]
    - role: env_sync
      tags: [env]
