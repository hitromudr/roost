---
# Removes roost from a stand.
#
#   ansible-playbook -i ansible/inventory ansible/playbooks/teardown.yml --check
#
# What goes: the egress rules and their unit, the launcher and session helper,
# and roost's own configuration directory.
#
# What stays, unless you pass -e roost_purge=true: your projects, your tmux
# sessions and the sandbox group. Those either hold your work or are annoying
# to recreate; removing them by default would make "let me try this" a
# decision with consequences.
#
# Also untouched, by design and not by omission: anything roost did not
# install. A web terminal, a tunnel, a shell environment on this machine
# belong to whoever put them there.
- name: Remove roost from the stand
  hosts: stand
  become: true
  vars:
    roost_purge: false
    egress_sandbox_group: agent-sandbox
    agent_sessions_prefix: roost-
  tasks:
    # --- what roost recorded installing ---------------------------------
    # Read before anything is removed, because the record lives in /etc/roost
    # and that directory goes below. A machine where roost never installed a
    # terminal has no such file, and nothing here fires — which is the whole
    # point: teardown removes what the state files list, so a terminal that
    # predates roost is not "cleaned up" by it.
    - name: Read what roost installed
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: roost_state
      failed_when: false
      loop:
        - /etc/roost/terminal.env
        - /etc/roost/expose.env

    - name: Work out what has to be taken back out
      ansible.builtin.set_fact:
        # selectattr before map: a file that is not there leaves a result with
        # no `content` at all, and picking the attribute out first would be
        # asking every version of jinja to agree about what that yields.
        roost_state_text: >-
          {{ roost_state.results | selectattr('content', 'defined')
             | map(attribute='content') | map('b64decode') | join('\n') }}

    - name: Note the pieces named in it
      ansible.builtin.set_fact:
        roost_terminal_src: "{{ roost_state_text | regex_search('TERMINAL_SRC=(\\S+)', '\\1') | default([''], true) | first }}"
        roost_expose_vhost: "{{ roost_state_text | regex_search('EXPOSE_VHOST=(\\S+)', '\\1') | default([''], true) | first }}"
        roost_go_dir: "{{ roost_state_text | regex_search('TERMINAL_GO_DIR=(\\S+)', '\\1') | default([''], true) | first }}"
        roost_expose_webroot: "{{ roost_state_text | regex_search('EXPOSE_WEBROOT=(\\S+)', '\\1') | default([''], true) | first }}"
        # Whether that directory is roost's to remove at all — see
        # EXPOSE_WEBROOT_OWNED in the expose role. A webroot the machine already
        # served from is not.
        #
        # Kept as a separate fact rather than folded into the expression above,
        # and this is worth knowing: written as a `>-` block, the same
        # `regex_search('...(\\S+)', '\\1')` fails on ansible-core 2.14 with
        # "AttributeError: 'NoneType' object has no attribute 'group'" — the
        # backslashes reach jinja differently there than from a double-quoted
        # scalar, the pattern stops matching, and the filter dereferences the
        # miss. Measured on the target's own ansible; the one on this machine
        # (2.19) accepts both, which is exactly why it was not caught here.
        roost_expose_webroot_owned: "{{ 'EXPOSE_WEBROOT_OWNED=true' in roost_state_text }}"
        roost_ca_dir: "{{ roost_state_text | regex_search('EXPOSE_CA_DIR=(\\S+)', '\\1') | default([''], true) | first }}"
        roost_enroll_dir: "{{ roost_state_text | regex_search('EXPOSE_ENROLL_DIR=(\\S+)', '\\1') | default([''], true) | first }}"

    # pockterm's own installer removes the unit and the binary it wrote. Using
    # it rather than deleting files by hand keeps one owner for those files
    # right to the end — and it keeps the token, the session Makefile and any
    # notification settings, which are the operator's, not roost's.
    - name: Remove the web terminal roost installed
      ansible.builtin.command:
        cmd: /bin/bash deploy/install.sh --uninstall
        chdir: "{{ roost_terminal_src }}"
      register: roost_terminal_removed
      changed_when: roost_terminal_removed.rc == 0
      failed_when: false
      when:
        - roost_terminal_src | length > 0
        - not ansible_check_mode

    - name: Remove roost's nginx file
      ansible.builtin.file:
        path: "{{ roost_expose_vhost }}"
        state: absent
      register: roost_vhost_removed
      when: roost_expose_vhost | length > 0

    # The reload is what makes the removal take effect, and it is safe in a way
    # the installation was not: taking a file out cannot break a configuration
    # that parsed with it in.
    - name: Reload nginx without it
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when:
        - roost_vhost_removed is changed
        - not ansible_check_mode

    - name: Remove the toolchain roost downloaded to build the terminal
      ansible.builtin.file:
        path: "{{ roost_go_dir }}"
        state: absent
      when: roost_go_dir | length > 0

    - name: Remove the terminal's source checkout
      ansible.builtin.file:
        path: "{{ roost_terminal_src }}"
        state: absent
      when: roost_terminal_src | length > 0

    # The authority goes with the rest of it. That is the decision it looks
    # like: every device enrolled against it stops being able to get in, which
    # is right — the terminal it let them into is being removed in the same
    # breath. Keeping the key "in case" would leave the one file on the machine
    # that can mint a way into a service that no longer exists.
    - name: Remove the certificate authority roost created
      ansible.builtin.file:
        path: "{{ roost_ca_dir }}"
        state: absent
      when: roost_ca_dir | length > 0

    - name: Remove the directory devices collected their bundles from
      ansible.builtin.file:
        path: "{{ roost_enroll_dir }}"
        state: absent
      when: roost_enroll_dir | length > 0

    - name: Remove the challenge directory roost created
      ansible.builtin.file:
        path: "{{ roost_expose_webroot }}"
        state: absent
      when:
        - roost_expose_webroot | length > 0
        - roost_expose_webroot_owned | bool

    # rmdir rather than `state: absent`: the directory is roost's by name, but
    # anything the operator has put inside it is not, and a failure to remove a
    # non-empty directory is the right outcome. Both of these were found by the
    # first teardown on a real machine, which left /opt/roost and the challenge
    # directory behind — with roost's own name on them.
    - name: Remove roost's directory under /opt, if nothing else is in it
      ansible.builtin.command: rmdir /opt/roost
      args:
        removes: /opt/roost
      register: roost_opt_removed
      changed_when: roost_opt_removed.rc == 0
      failed_when: false
      when: not ansible_check_mode

    # `systemd`, not `systemd_service`: the newer name needs ansible-core
    # 2.16, and a stand may well have been installed with the 2.14 its
    # distribution ships. Removal has to work on the same machine as
    # installation.
    - name: Stop and disable the services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop:
        - egress-firewall
      when: not ansible_check_mode

    # Rules live in the kernel: stopping the unit is not enough if it was
    # never started by systemd in this boot.
    - name: Clear the egress rules
      ansible.builtin.command: /usr/local/sbin/egress-firewall clear
      environment:
        EGRESS_GROUP: "{{ egress_sandbox_group }}"
        EGRESS_PROFILE: pinned
        EGRESS_GID: "0"
      failed_when: false
      changed_when: true
      when: not ansible_check_mode

    - name: Remove the units
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - egress-firewall.service

    - name: Remove the commands
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/sbin/egress-firewall
        - /usr/local/sbin/roost-ca
        - /usr/local/sbin/roost-enroll
        - /usr/local/bin/agent-run
        - /usr/local/bin/agent-exec
        - /usr/local/bin/roost-session
        - /etc/profile.d/roost-session.sh

    # A second agent is a symlink to the launcher, and the launcher above has
    # just gone: leaving the links behind would leave `codex-safe` on the
    # machine pointing at nothing. Selected by what they point at rather than
    # by name, because the names are configuration and teardown does not read
    # it.
    - name: Remove the launchers of any extra agents
      ansible.builtin.command: find /usr/local/bin -maxdepth 1 -lname /usr/local/bin/agent-run -print -delete
      register: roost_links_removed
      changed_when: roost_links_removed.stdout | length > 0
      when: not ansible_check_mode

    - name: Remove roost's configuration
      ansible.builtin.file:
        path: /etc/roost
        state: absent

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: not ansible_check_mode

    # --- only with roost_purge ---------------------------------------

    - name: Remove the sandbox group
      ansible.builtin.group:
        name: "{{ egress_sandbox_group }}"
        state: absent
      when: roost_purge | bool

    - name: List sessions that are still running
      ansible.builtin.command: tmux list-sessions -F '#{session_name}'
      register: roost_sessions
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Say what was left alone
      ansible.builtin.debug:
        msg:
          - Removed roost from this machine.
          - "Still yours: projects, and {{ roost_left_sessions | length }}
             running session(s) — end them with tmux kill-session."
      vars:
        roost_left_sessions: >-
          {{ roost_sessions.stdout_lines | default([])
             | select('match', agent_sessions_prefix) | list }}

    - name: Mention what --purge would also remove
      ansible.builtin.debug:
        msg: >-
          Kept: the {{ egress_sandbox_group }} group.
          Pass -e roost_purge=true to remove it too.
      when: not (roost_purge | bool)
