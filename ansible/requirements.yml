---
# Collections the roles depend on. Install with `make deps`.
collections:
  # openssh_keypair (tunnel key), openssl_* and x509_certificate (client CA).
  # Capped below 3.0: that release requires ansible-core 2.17, while the
  # current Ubuntu LTS still ships 2.16 — and a stand is exactly the kind of
  # machine running a distribution's ansible.
  - name: community.crypto
    version: ">=2.0.0,<3.0.0"
  # authorized_key, for the tunnel account on the gate
  - name: ansible.posix
    version: ">=1.5.0"
