---
# Everything here is guarded by one condition rather than `meta: end_role`,
# which needs ansible-core 2.17 while the current Ubuntu LTS ships 2.16.
- name: Sync the environment
  when: env_sync_repo | length > 0
  block:
    # git is normally already there; installing it needs root, and this role
    # is also useful on a machine you are not root on.
    - name: Look for git # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: git --version
      register: env_sync_git
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install git
      become: true
      ansible.builtin.package:
        name: git
        state: present
      when: env_sync_git.rc | default(1) != 0

    - name: Check out the environment repository
      become: true
      become_user: "{{ env_sync_user }}"
      ansible.builtin.git:
        repo: "{{ env_sync_repo }}"
        dest: "{{ env_sync_dir }}"
        version: "{{ env_sync_version if env_sync_version != 'HEAD' else omit }}"
        # Local edits are the user's, not ours to discard.
        update: true
        force: false
      register: env_sync_checkout

    # "auto" means the checkout decides: a repository carrying sops files
    # needs the key, one carrying none does not. Asked after checkout, on the
    # target, because that is the only place the answer exists.
    - name: Look for encrypted files in the checkout
      ansible.builtin.find:
        paths: "{{ env_sync_dir }}"
        patterns: "{{ env_sync_secret_patterns }}"
        recurse: true
        hidden: true
        file_type: file
      register: env_sync_secrets
      when: env_sync_expect_age_key | string | lower == 'auto'

    - name: Decide whether the age key is required
      ansible.builtin.set_fact:
        env_sync_key_required: >-
          {{ (env_sync_secrets.files | default([]) | length > 0)
             if (env_sync_expect_age_key | string | lower == 'auto')
             else (env_sync_expect_age_key | bool) }}

    - name: Say which encrypted files asked for the key
      ansible.builtin.debug:
        msg: >-
          {{ env_sync_secrets.files | length }} encrypted file(s) in
          {{ env_sync_dir }} — the age key is required.
      when:
        - env_sync_expect_age_key | string | lower == 'auto'
        - env_sync_key_required | bool

    # A key that is absent leaves every secret encrypted while the installer
    # reports success — worth stopping for, because the failure is silent.
    - name: Check the age key is present
      ansible.builtin.stat:
        path: "{{ env_sync_age_key }}"
      register: env_sync_key
      when: env_sync_key_required | bool

    - name: Fail when the age key is missing
      ansible.builtin.assert:
        that: env_sync_key.stat.exists
        fail_msg: >-
          {{ env_sync_age_key }} is missing, so encrypted secrets will not
          decrypt. Move the key here by hand — that step cannot be automated,
          since automating it would mean guarding the key with a secret kept on
          the same machine.
        quiet: true
      when: env_sync_key_required | bool

    - name: Check the age key is not readable by others
      ansible.builtin.file:
        path: "{{ env_sync_age_key }}"
        mode: "0600"
      when:
        - env_sync_key_required | bool
        - env_sync_key.stat.exists | default(false)

    - name: Run the environment installer
      become: true
      become_user: "{{ env_sync_user }}"
      ansible.builtin.command:
        cmd: "{{ env_sync_install_cmd }}"
        chdir: "{{ env_sync_dir }}"
      register: env_sync_install
      # The installers this is meant for are idempotent and report what they did;
      # ansible cannot tell, so changes are reported only when the checkout moved.
      changed_when: env_sync_checkout.changed
      when:
        - env_sync_install_cmd | length > 0
        - not ansible_check_mode
