---
# The domain the phone opens.
gate_domain: ""

# Where the stand appears on this machine's loopback — the other end of the
# reverse tunnel.
gate_upstream_port: 18130

# token — TLS plus pockterm's shared token. Quick to set up; the token ends
#         up in browser history and proxy logs.
# mtls  — client certificates. A scan of the internet sees a failed
#         handshake instead of a login page.
gate_auth: mtls

gate_tls_cert: "/etc/letsencrypt/live/{{ gate_domain }}/fullchain.pem"
gate_tls_key: "/etc/letsencrypt/live/{{ gate_domain }}/privkey.pem"

# Client CA for the mtls mode. The role creates one if it is absent; the key
# can mint certificates for your terminal, so it is as sensitive as the stand.
gate_ca_dir: /etc/roost/ca
gate_ca_days: 3650
gate_client_days: 825
# Client certificates to issue, one per device.
gate_clients:
  - phone

# The unprivileged account the stand's tunnel logs in as.
gate_tunnel_user: roost-tunnel
# Public keys of the stands allowed to publish through this gate.
gate_tunnel_keys: []
