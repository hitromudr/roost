---
- name: Validate the egress profile
  ansible.builtin.assert:
    that: egress_sandbox_profile in ['pinned', 'proxied', 'direct']
    fail_msg: >-
      egress_sandbox_profile is '{{ egress_sandbox_profile }}';
      expected pinned, proxied or direct
    quiet: true

# Created before anything writes into it: several tasks below do, and a
# missing directory fails them one by one.
- name: Create the roost configuration directory
  ansible.builtin.file:
    path: /etc/roost
    state: directory
    mode: "0755"

- name: Create the sandbox group
  ansible.builtin.group:
    name: "{{ egress_sandbox_group }}"
    state: present
  register: egress_sandbox_group_info

- name: Add users to the sandbox group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ egress_sandbox_group }}"
    append: true
  loop: "{{ egress_sandbox_users }}"

- name: Install the firewall script
  ansible.builtin.copy:
    src: egress-firewall
    dest: "{{ egress_sandbox_firewall_bin }}"
    mode: "0755"
  notify: Reapply egress policy

- name: Install the agent launcher
  ansible.builtin.copy:
    src: agent-run
    dest: "{{ egress_sandbox_wrapper }}"
    mode: "0755"

# The other shape of the same launcher: for callers that hand over a whole
# command line rather than arguments to the configured agent. The web
# terminal's custom buttons are the reason it exists — see the header of the
# script.
- name: Install the launcher for an arbitrary command
  ansible.builtin.copy:
    src: agent-exec
    dest: "{{ egress_sandbox_exec_wrapper }}"
    mode: "0755"

# The launcher reads its configuration from the environment, and a wrapper
# script is the least surprising way to supply it: the user types `agent-run`,
# not a line of exports.
- name: Configure the agent launcher
  ansible.builtin.template:
    src: agent-run.env.j2
    dest: /etc/roost/agent-run.env
    mode: "0644"

# A second agent is a second name for the same launcher: the link's own name
# picks the file below, and everything else it uses is the machine's. Nothing
# is created when no extra agents are declared, so a stand that knows one agent
# keeps the layout it had.
- name: Create the directory for the extra agents
  ansible.builtin.file:
    path: "{{ egress_sandbox_agent_dir }}"
    state: directory
    mode: "0755"
  when: egress_sandbox_agents | length > 0

- name: Name each extra agent's binary
  ansible.builtin.template:
    src: agent.env.j2
    dest: "{{ egress_sandbox_agent_dir }}/{{ item.key }}.env"
    mode: "0644"
  loop: "{{ egress_sandbox_agents | dict2items }}"

- name: Install a launcher for each extra agent
  ansible.builtin.file:
    src: "{{ egress_sandbox_wrapper }}"
    dest: "{{ egress_sandbox_wrapper | dirname }}/{{ item.key }}{{ egress_sandbox_agent_suffix }}"
    state: link
  loop: "{{ egress_sandbox_agents | dict2items }}"

- name: Ensure the credentials directory exists
  ansible.builtin.file:
    path: "{{ egress_sandbox_env_file | dirname }}"
    state: directory
    mode: "0755"
  when: (egress_sandbox_env_file | dirname) != '/etc/roost'

# Written once as a template when no URL is supplied: overwriting on every run
# would erase what the operator typed in by hand.
# Owned by the sandbox group, not by root alone: agent-run reads this as the
# user, and a file it cannot open makes the launcher fail on its first line —
# the session then dies the moment tmux starts it, with the reason buried.
- name: Seed the credentials file
  ansible.builtin.copy:
    content: |
      # Proxy the sandboxed agent reaches the internet through.
      # PROXY_URL=http://user:password@127.0.0.1:8129
    dest: "{{ egress_sandbox_env_file }}"
    owner: "{{ egress_sandbox_users | first | default('root') }}"
    group: "{{ egress_sandbox_group }}"
    mode: "0640"
    force: false
  when: egress_sandbox_proxy_url | length == 0

- name: Write the credentials file
  ansible.builtin.copy:
    content: "PROXY_URL={{ egress_sandbox_proxy_url }}\n"
    dest: "{{ egress_sandbox_env_file }}"
    owner: "{{ egress_sandbox_users | first | default('root') }}"
    group: "{{ egress_sandbox_group }}"
    mode: "0640"
  when: egress_sandbox_proxy_url | length > 0
  no_log: true

# After both of the tasks that can create the file, and that order is the whole
# point: copy with force:false skips an existing file entirely — attributes and
# all — so ownership has to be set separately, but on a machine where the file
# does not exist yet and a proxy *was* supplied, only the task above creates it.
# Standing before that task, this one failed with "file is absent, cannot
# continue" on the first stand installed from a config file rather than by hand
# (2026-08-05). The old order worked only where the file already existed.
#
# Owned by the agent's account rather than by root: group membership is fixed
# when a process starts, so a tmux server running since before this role first
# ran will never see the new group, and every session it spawns dies on an
# unreadable file. `sg` still switches the group correctly, because it reads
# /etc/group rather than the caller's process.
- name: Keep the credentials file readable by the agent
  ansible.builtin.file:
    path: "{{ egress_sandbox_env_file }}"
    owner: "{{ egress_sandbox_users | first | default('root') }}"
    group: "{{ egress_sandbox_group }}"
    mode: "0640"

# A pinned profile with no proxy is not a locked-down agent, it is an agent
# with no network at all: it rejects direct egress and offers nothing in its
# place, so the agent dies on its first API call. Worth saying at install
# time, when the file is right there to fill in.
- name: Check the sandbox has a way out
  ansible.builtin.command: grep -c '^PROXY_URL=..*' {{ egress_sandbox_env_file | quote }}
  register: egress_sandbox_proxy_set
  changed_when: false
  failed_when: false
  when:
    - egress_sandbox_profile != 'direct'
    - not ansible_check_mode

- name: Say that the agent currently has no network
  ansible.builtin.debug:
    msg: >-
      Profile '{{ egress_sandbox_profile }}' rejects direct egress, and
      {{ egress_sandbox_env_file }} has no PROXY_URL — the agent will start
      with no network at all and fail on its first request. Put the proxy
      there (PROXY_URL=http://user:password@host:port) and re-run, or choose
      the 'direct' profile if that is what you meant.
  when:
    - egress_sandbox_profile != 'direct'
    - not ansible_check_mode
    - (egress_sandbox_proxy_set.stdout | default('0') | trim) == '0'

- name: Install the firewall unit
  ansible.builtin.template:
    src: egress-firewall.service.j2
    dest: /etc/systemd/system/egress-firewall.service
    mode: "0644"
  notify: Reapply egress policy

# The rules live in the kernel, not on disk, so they have to be reinstated
# after every boot — before anything the agent might start.
# Skipped under --check: the unit file is not written in that mode, so
# systemd would report a service it has never heard of and the run would fail
# on an artefact of the dry run rather than on anything real.
#
# `systemd`, not `systemd_service`: the newer name arrived in ansible-core
# 2.16, and the ansible a distribution ships is often older — Debian 12 has
# 2.14, Ubuntu 22.04 has 2.12. On those the role failed on an unknown module,
# which is a strange way to learn that a stand cannot be installed. The old
# name still resolves on current core, so this works both ways.
- name: Enable the firewall unit
  ansible.builtin.systemd:
    name: egress-firewall
    enabled: "{{ egress_sandbox_profile != 'direct' }}"
    state: "{{ 'started' if egress_sandbox_profile != 'direct' else 'stopped' }}"
    daemon_reload: true
  when: not ansible_check_mode

- name: Verify the policy is in place
  ansible.builtin.command: "{{ egress_sandbox_firewall_bin }} show"
  environment:
    EGRESS_GROUP: "{{ egress_sandbox_group }}"
    EGRESS_GID: "{{ egress_sandbox_group_info.gid | default('') }}"
    EGRESS_PROFILE: "{{ egress_sandbox_profile }}"
  register: egress_sandbox_state
  changed_when: false
  when:
    - egress_sandbox_profile != 'direct'
    - not ansible_check_mode

- name: Fail when the rules did not take
  ansible.builtin.assert:
    that: egress_sandbox_state.stdout | length > 0
    fail_msg: >-
      No rules tagged '{{ egress_sandbox_group }}' are installed —
      the agent would have unrestricted egress while looking sandboxed
    quiet: true
  when:
    - egress_sandbox_profile != 'direct'
    - not ansible_check_mode
