---
# Group the agent runs under. Every firewall rule matches on its gid, so the
# policy follows the process rather than a port or a destination.
egress_sandbox_group: agent-sandbox

# pinned   — loopback only; the agent reaches the internet through a local
#            proxy that is itself outside the sandbox, so its exit address
#            stays the same wherever the machine is.
# proxied  — the same, plus the destinations listed in _allow.
# direct   — no restrictions. Present so that "unrestricted" is a choice
#            somebody made, not the result of skipping configuration.
egress_sandbox_profile: pinned

# Destinations for the proxied profile: addresses or CIDRs. Anything with a
# colon is treated as IPv6.
egress_sandbox_allow: []

# Accounts to add to the group. They keep their primary group; membership
# only matters for processes started through agent-run.
egress_sandbox_users: []

# The agent itself. Anything that speaks a terminal works — the sandbox does
# not care what it is.
egress_sandbox_agent_command: /usr/local/bin/claude

# Further agents, each reachable under its own launcher name: the key is the
# agent's name, the value is the binary it starts.
#
#   egress_sandbox_agents:
#     codex: /home/dms/.local/bin/codex
#
# gives /usr/local/bin/codex-safe — a link to the same launcher, which reads
# the binary from /etc/roost/agents/codex.env and takes the group, the proxy
# and the profile from the machine's own configuration. One group for all of
# them: the policy is identical, and a second group would be a second thing to
# keep in step for no gain (see docs/superpowers/specs/2026-08-04-second-agent).
egress_sandbox_agents: {}

# What those launchers are called. `-safe` is the name the wrappers on these
# machines already carry, so the habit transfers.
egress_sandbox_agent_suffix: "-safe"
egress_sandbox_agent_dir: /etc/roost/agents

# Credentials live in a file with 0600 permissions, not in the playbook and
# not in the wrapper. Leave _proxy_url empty and the role writes a template
# you fill in by hand; set it (from a vault, or --extra-vars) and the role
# writes it for you.
egress_sandbox_env_file: /etc/roost/agent-proxy.env
egress_sandbox_proxy_url: ""

egress_sandbox_wrapper: /usr/local/bin/agent-run
egress_sandbox_firewall_bin: /usr/local/sbin/egress-firewall
