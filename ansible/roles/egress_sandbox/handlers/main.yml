---
# `systemd` rather than `systemd_service` — see the note in tasks/main.yml:
# the newer name needs core 2.16, and distributions ship older.
- name: Reapply egress policy
  ansible.builtin.systemd:
    name: egress-firewall
    state: restarted
    daemon_reload: true
  when:
    - egress_sandbox_profile != "direct"
    - not ansible_check_mode
