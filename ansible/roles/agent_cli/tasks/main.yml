---
- name: Look for an agent already on the machine
  ansible.builtin.stat:
    path: "{{ agent_cli_command }}"
  register: agent_cli_present

# An agent that is already there is left exactly as it is. Re-running the
# installer would be a second owner of the same binary, and the operator's own
# npm-installed or distribution-packaged agent is not roost's to replace.
- name: Say the agent is already installed
  ansible.builtin.debug:
    msg: "{{ agent_cli_command }} is already installed — leaving it alone"
  when: agent_cli_present.stat.exists

- name: Refuse to continue without an agent
  ansible.builtin.assert:
    that: agent_cli_present.stat.exists
    fail_msg: >-
      No agent at {{ agent_cli_command }} and agent_cli_install is false.
      Install one, or set agent_cli_command to the binary you already have —
      a sandbox around a command that does not exist gives a session that
      closes the moment it opens.
    quiet: true
  when: not (agent_cli_install | bool)

- name: Install the agent
  when:
    - agent_cli_install | bool
    - not agent_cli_present.stat.exists
    - not ansible_check_mode
  block:
    # curl is what the installer uses to fetch its own pieces; without it the
    # script fails halfway and leaves nothing behind to say why.
    - name: Install what the installer needs
      ansible.builtin.package:
        name: curl
        state: present

    # force, because the copy on disk is not evidence about today. get_url asks
    # the server whether it has anything newer, and a refusal already written to
    # this path answers that question with "no": measured 2026-08-10, a 470KB
    # HTML page downloaded on the 9th outlived the proxy that fixed the
    # download, and every run afterwards refused by quoting it. The channel was
    # working, the file was not, and the message described neither — worse than
    # the failure it replaced, because it named a response the server no longer
    # gave. Removing the file made the same command install the agent.
    - name: Fetch the official installer
      ansible.builtin.get_url:
        url: "{{ agent_cli_installer_url }}"
        dest: /tmp/roost-agent-install.sh
        mode: "0755"
        force: true
      environment: "{{ agent_cli_download_env }}"

    # A 200 is not a script, and everything in the way answers with one.
    # A regional block, a captive portal and a filtering proxy all reply with
    # an HTML page and the status of a success — get_url is satisfied by both,
    # and the page was then handed to bash. Measured 2026-08-09 installing into
    # a container whose exit is not served by Anthropic: what came back was
    # `App unavailable in region | Claude by Anthropic`, and the whole report
    # was `syntax error near unexpected token '<'` on line 1. The machine had
    # said exactly why, in the file it had just downloaded, and nothing read it.
    #
    # `head` rather than slurp, because what arrives when this goes wrong is
    # not guaranteed to be text at all and a decoding error would be one more
    # way of not saying what happened.
    - name: Read the start of what arrived
      ansible.builtin.command: head -c 2000 /tmp/roost-agent-install.sh
      register: agent_cli_head
      changed_when: false

    # The title, when there is one, and the first bytes otherwise. A page's
    # opening bytes are a build stamp and a list of preconnect hints — true,
    # useless, and where the first version of this message stopped. What says
    # why is the title, and on the page this was written against it sits four
    # hundred bytes in: `App unavailable in region | Claude by Anthropic`.
    - name: Refuse anything that is not a script
      ansible.builtin.assert:
        that: agent_cli_head.stdout.startswith('#!')
        fail_msg: >-
          {{ agent_cli_installer_url }} did not answer with a script — running
          it would report a shell syntax error and say nothing about why. What
          came back: {{ agent_cli_title | default(agent_cli_head.stdout[:200] | trim, true) }}
        quiet: true
      vars:
        agent_cli_title: >-
          {{ (agent_cli_head.stdout | regex_search('<title>([^<]*)</title>', '\1') | default([], true) | first | default('', true)) | trim }}

    # Run as the agent's own account: the installer writes into that account's
    # ~/.local, and a copy under /root would not be the agent any session
    # starts.
    - name: Run the installer as the agent's account
      ansible.builtin.command: /bin/bash /tmp/roost-agent-install.sh
      args:
        creates: "{{ agent_cli_command }}"
      become: true
      become_user: "{{ agent_cli_user }}"
      environment: "{{ agent_cli_download_env }}"

    - name: Remove the installer
      ansible.builtin.file:
        path: /tmp/roost-agent-install.sh
        state: absent

    - name: Confirm the agent is now there
      ansible.builtin.stat:
        path: "{{ agent_cli_command }}"
      register: agent_cli_after

    - name: Fail when the installer left no binary
      ansible.builtin.assert:
        that: agent_cli_after.stat.exists
        fail_msg: >-
          The installer finished but {{ agent_cli_command }} is not there.
          Run it by hand to see what it says:
          curl -fsSL {{ agent_cli_installer_url }} | bash
        quiet: true

    - name: Note that this run installed the agent
      ansible.builtin.set_fact:
        agent_cli_installed_now: true

# Asked rather than assumed: a binary that exists and a binary that runs are
# different claims, and the difference here is an agent that dies on its first
# session. Failure is not fatal — an agent that cannot answer `--version` may
# still be one the operator wants recorded — but it is said out loud.
#
# Asked under the sandbox group where there is one, because the path may be a
# gate rather than the binary (see agent_cli_sandbox_group): a gate refuses the
# plain call, and the refusal would be recorded as an unknown version. Measured
# on the RPi5 and the spare laptop, where ~/.local/bin/claude is exactly that.
- name: Ask the agent for its version
  ansible.builtin.shell: |
    set -u
    # Membership by string match rather than piping `id -nG` into `grep -q`:
    # grep leaves as soon as it matches, the writer takes SIGPIPE, and under
    # pipefail the status becomes 141 — false exactly when the group is there.
    # Padded with spaces so "agent" cannot match inside "agent-sandbox".
    case " $(id -nG "$AGENT_USER") " in
      *" $AGENT_GROUP "*) exec sg "$AGENT_GROUP" -c "\"$AGENT_CMD\" --version" ;;
    esac
    exec "$AGENT_CMD" --version
  environment:
    # Passed as values rather than pasted into the script: a path or a group
    # name goes into the shell as data, not as text that becomes syntax.
    AGENT_USER: "{{ agent_cli_user }}"
    AGENT_GROUP: "{{ agent_cli_sandbox_group }}"
    AGENT_CMD: "{{ agent_cli_command }}"
  register: agent_cli_version_out
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ agent_cli_user }}"
  when: not ansible_check_mode

- name: Say the agent does not run here
  ansible.builtin.debug:
    msg: >-
      {{ agent_cli_command }} is installed but `--version` failed
      ({{ agent_cli_version_out.stderr | default('') | trim }}). Sessions
      started for it will close immediately — check the binary before relying
      on the stand. A gate on that path refuses launches from outside
      {{ agent_cli_sandbox_group }}, so check that group first: this run asked
      under it only if the account is a member.
  when:
    - not ansible_check_mode
    - agent_cli_version_out.rc | default(1) != 0

# Created here as well as in egress_sandbox, because this role runs first: an
# agent has to exist before there is a point in sandboxing one. Two roles
# declaring the same directory the same way is idempotent; the ordering is not
# negotiable, and the alternative was a run that installed the agent and then
# failed on a missing directory — measured on the first real machine.
- name: Create the roost configuration directory
  ansible.builtin.file:
    path: "{{ agent_cli_state_file | dirname }}"
    state: directory
    mode: "0755"

- name: Record what the agent is
  ansible.builtin.template:
    src: agent.env.j2
    dest: "{{ agent_cli_state_file }}"
    mode: "0644"
  vars:
    agent_cli_resolved_command: "{{ agent_cli_command }}"
    agent_cli_version: >-
      {{ (agent_cli_version_out.stdout | default('unknown')) | trim | default('unknown', true) }}
