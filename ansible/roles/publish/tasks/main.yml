---
- name: Install packages the stand needs
  ansible.builtin.package:
    name:
      - git
      - tmux
      - autossh
      # Needed by community.crypto for the tunnel key.
      - python3-cryptography
    state: present

# pockterm installs itself — binary, token, unit, all idempotent. Reproducing
# that here would mean two installers disagreeing about the same machine.
- name: Fetch pockterm
  ansible.builtin.git:
    repo: "{{ publish_pockterm_repo }}"
    dest: "{{ publish_pockterm_dir }}"
    version: "{{ publish_pockterm_version }}"
  register: publish_pockterm_checkout

# Its installer prefers a prebuilt binary when there is no toolchain, so
# dropping one in the checkout is all it takes.
- name: Make room for the prebuilt binary
  ansible.builtin.file:
    path: "{{ publish_pockterm_dir }}/bin"
    state: directory
    mode: "0755"
  when:
    - publish_pockterm_binary | length > 0
    - not ansible_check_mode

- name: Ship a prebuilt terminal binary
  ansible.builtin.copy:
    src: "{{ publish_pockterm_binary }}"
    dest: "{{ publish_pockterm_dir }}/bin/pockterm"
    mode: "0755"
  when:
    - publish_pockterm_binary | length > 0
    - not ansible_check_mode

# Skipped under --check: the checkout above does not happen in that mode, so
# this would fail on a missing directory rather than on anything real.
- name: Run pockterm's own installer
  ansible.builtin.command:
    cmd: bash deploy/install.sh
    chdir: "{{ publish_pockterm_dir }}"
  environment:
    POCKTERM_LISTEN: "{{ publish_listen }}"
    POCKTERM_USER: "{{ publish_user | default(ansible_user_id) }}"
    POCKTERM_NO_TOKEN: "{{ '' if publish_token | bool else '1' }}"
  register: publish_pockterm_install
  changed_when: "'token generated' in publish_pockterm_install.stdout
                 or 'unit →' in publish_pockterm_install.stdout"
  when: not ansible_check_mode

# --- tunnel to the gate ------------------------------------------------
# Skipped entirely when no gate is configured: a stand with a routable
# address publishes itself.

- name: Create the roost directory
  ansible.builtin.file:
    path: /etc/roost
    state: directory
    mode: "0755"
  when: publish_gate_host | length > 0

- name: Generate the tunnel key
  community.crypto.openssh_keypair:
    path: "{{ publish_tunnel_key }}"
    type: ed25519
    comment: "roost tunnel {{ inventory_hostname }}"
    mode: "0600"
  register: publish_tunnel_keypair
  when: publish_gate_host | length > 0

- name: Show the public key to authorise on the gate
  ansible.builtin.debug:
    msg: >-
      Authorise this key on the gate as {{ publish_gate_user }}:
      {{ publish_tunnel_keypair.public_key | default('') }}
  when:
    - publish_gate_host | length > 0
    - publish_tunnel_keypair.changed | default(false)

- name: Install the tunnel command generator
  ansible.builtin.copy:
    src: tunnel-command
    dest: "{{ publish_tunnel_bin }}"
    mode: "0755"
  when: publish_gate_host | length > 0
  notify: Restart tunnel

- name: Install the tunnel unit
  ansible.builtin.template:
    src: roost-tunnel.service.j2
    dest: /etc/systemd/system/roost-tunnel.service
    mode: "0644"
  when: publish_gate_host | length > 0
  notify: Restart tunnel

- name: Enable the tunnel
  ansible.builtin.systemd_service:
    name: roost-tunnel
    enabled: true
    state: started
    daemon_reload: true
  when:
    - publish_gate_host | length > 0
    - not ansible_check_mode

- name: Report where the terminal is now reachable
  ansible.builtin.debug:
    msg: >-
      {% if publish_gate_host | length > 0 %}
      The terminal is on the gate at 127.0.0.1:{{ publish_remote_port }} —
      point the gate's nginx there.
      {% else %}
      The terminal listens on {{ publish_listen }} — put TLS and
      authentication in front of it before exposing anything.
      {% endif %}
