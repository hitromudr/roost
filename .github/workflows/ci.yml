name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck bats
          pipx install ansible-lint
      - run: make lint
      - run: make test
